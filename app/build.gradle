plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.maoge.barcodescanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.maoge.barcodescanner"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // 发布签名：口令来自 local.properties（已被 .gitignore 忽略，不会入库）
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(localPropsFile.newDataInputStream())
    }
    def hasReleaseSigning = localProps.containsKey('barcode.storeFile')

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(localProps['barcode.storeFile'])
                storePassword localProps['barcode.storePassword']
                keyAlias localProps['barcode.keyAlias']
                keyPassword localProps['barcode.keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX：稳定可靠的相机预览 + 图像分析（完全离线，无需联网）
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax}"
    implementation "androidx.camera:camera-camera2:${camerax}"
    implementation "androidx.camera:camera-lifecycle:${camerax}"
    implementation "androidx.camera:camera-view:${camerax}"

    // ZXing 核心：离线多码解码（69码/EAN-13、SN/Code128、IMEI 等）
    implementation 'com.google.zxing:core:3.5.3'
}
